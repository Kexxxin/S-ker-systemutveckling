<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Admin - Produkter</title>

    <script>
        const role = localStorage.getItem("role");
        if (role !== "Admin") {
            window.location.replace("products.html");
        }
    </script>

    <link rel="stylesheet" href="../css/style.css">
</head>


<body>


    <nav>
        <a href="login.html"><button>Login</button></a>
        <a href="register.html"><button>Register</button></a>
        <a href="products.html"><button>Produkter</button></a>
        <a href="orders.html"><button>Mina Order</button></a>
        <a href="admin.html"><button>Admin</button></a>
        <button onclick="logout()" style="background:#c00;color:white;">Logga ut</button>
    </nav>

    <h2>Admin - Hantera Produkter</h2>

    <div class="card">
        <h3>Skapa ny produkt</h3>
        <input id="newName" placeholder="Produktnamn">
        <input id="newPrice" type="number" placeholder="Pris">
        <input id="newImageUrl" placeholder="Bild-URL">
        <button onclick="createProduct()">Skapa produkt</button>
    </div>

    <h3>Befintliga produkter</h3>
    <div id="adminProductList"></div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/logout.js"></script>

</body>

</html>
